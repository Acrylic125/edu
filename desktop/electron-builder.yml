appId: dev.benapps.prune
productName: EdU
icon: resources/icon.png
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../phoenix
    to: phoenix
    filter:
      - export_traces.py
      - export_traces.py.lock
      - README.md
      - compose.yaml
  - from: resources
    to: resources
asar: true
# OCR worker threads resolve their modules and language data outside the archive.
asarUnpack:
  - node_modules/**
mac:
  category: public.app-category.education
  target: [dmg, zip]
win:
  target: nsis
linux:
  category: Education
  target: AppImage
