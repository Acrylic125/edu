name: Legacy production deployment (disabled)

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Web delivery is paused; keep the legacy configuration available for later.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    env:
      # Wrangler requires this process variable name; the GitHub secret is named
      # CLOUDFLARE_DEPLOY_TOKEN to distinguish it from the app's D1 token.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
      MICROSOFT_TENANT_ID: ${{ vars.MICROSOFT_TENANT_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      LANGTRACE_API_KEY: ${{ secrets.LANGTRACE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            packages/chat-contract/pnpm-lock.yaml
            packages/ui/pnpm-lock.yaml
            backend/edu-api/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir packages/chat-contract install --frozen-lockfile
          pnpm --dir packages/ui install --frozen-lockfile
          pnpm --dir backend/edu-api install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile

      - name: Apply production migrations
        run: pnpm --dir backend/edu-api run db:migrate:remote:production-ben

      - name: Deploy API Worker
        run: pnpm --dir backend/edu-api run deploy:production-ben

      - name: Set API Worker secrets
        run: |
          put_secret() {
            printf '%s' "$2" | pnpm --dir backend/edu-api exec wrangler secret put "$1" --env production-ben
          }
          put_secret BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"
          put_secret LANGTRACE_API_KEY "$LANGTRACE_API_KEY"
          put_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put_secret R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          put_secret R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"

      - name: Deploy web Worker
        run: pnpm --dir web run deploy:production-ben

      - name: Set web Worker secrets
        run: |
          put_secret() {
            printf '%s' "$2" | pnpm --dir web exec wrangler secret put "$1" --env production-ben
          }
          put_secret BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"
          put_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          put_secret MICROSOFT_CLIENT_SECRET "$MICROSOFT_CLIENT_SECRET"
          put_secret CLOUDFLARE_TOKEN "$CLOUDFLARE_TOKEN"
